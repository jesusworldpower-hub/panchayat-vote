<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Ledger Console</title>
    <style>
      :root {
        --bg-1: #020817;
        --bg-2: #0f172a;
        --panel: rgba(15, 23, 42, 0.74);
        --line: rgba(148, 163, 184, 0.2);
        --text: #e2e8f0;
        --muted: #a5b4cf;
        --primary: #4f46e5;
        --emerald: #10b981;
        --amber: #fbbf24;
        --danger: #ef4444;
        --shadow: 0 18px 40px rgba(15, 23, 42, 0.45);
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        min-height: 100%;
        background: linear-gradient(135deg, #020817 0%, #0f172a 48%, #111827 100%);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: var(--text);
      }

      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background-image:
          linear-gradient(rgba(2, 8, 23, 0.6), rgba(15, 23, 42, 0.72)),
          url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=1600&q=80');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
      }

      .site-credit {
        margin-top: 12px;
        color: rgba(226, 232, 240, 0.78);
        font-size: 0.78rem;
        text-align: center;
      }

      @keyframes fadePage {
        0% { opacity: 0; transform: scale(0.985); }
        100% { opacity: 1; transform: scale(1); }
      }

      @keyframes riseIn {
        0% {
          opacity: 0;
          transform: translateY(18px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes glowPulse {
        0%, 100% { box-shadow: 0 0 0 rgba(79, 70, 229, 0.18); }
        50% { box-shadow: 0 0 24px rgba(79, 70, 229, 0.2); }
      }

      .auth-shell,
      .console-shell {
        width: min(1200px, 100%);
      }

      .auth-shell {
      }

      .console-shell {
      }

      .auth-shell {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .auth-panel,
      .console-panel {
        width: min(720px, 100%);
        border-radius: 28px;
        background: rgba(15, 23, 42, 0.7);
        border: 1px solid var(--line);
        box-shadow: var(--shadow);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        overflow: hidden;
      }

      .auth-panel {
        padding: 28px 22px 24px;
      }

      .lock-icon {
        width: 84px;
        height: 84px;
        margin: 0 auto 16px;
        border-radius: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.2rem;
        background: linear-gradient(135deg, rgba(79, 70, 229, 0.2), rgba(16, 185, 129, 0.18));
        border: 1px solid rgba(79, 70, 229, 0.32);
      }

      .auth-panel h1 {
        margin: 0;
        text-align: center;
        font-size: clamp(2rem, 2vw + 1rem, 2.8rem);
        letter-spacing: -0.05em;
      }

      .auth-panel p {
        margin: 12px auto 22px;
        text-align: center;
        color: var(--muted);
        max-width: 480px;
      }

      .password-box {
        display: grid;
        gap: 16px;
      }

      input[type="password"] {
        width: 100%;
        border: 1px solid rgba(148, 163, 184, 0.25);
        background: rgba(15, 23, 42, 0.72);
        color: var(--text);
        border-radius: 16px;
        padding: 15px 16px;
        font-size: 1rem;
        outline: none;
      }

      input[type="password"]:focus {
        border-color: rgba(79, 70, 229, 0.7);
        box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12);
      }

      .primary-btn,
      .danger-btn,
      .ghost-btn {
        appearance: none;
        border: none;
        border-radius: 14px;
        padding: 13px 16px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        cursor: pointer;
        transition: transform 0.2s ease, opacity 0.2s ease;
      }

      .lang-toggle {
        border: 1px solid rgba(148, 163, 184, 0.25);
        background: rgba(15, 23, 42, 0.42);
        color: var(--text);
        border-radius: 999px;
        padding: 9px 12px;
        font-size: 0.72rem;
        font-weight: 700;
        cursor: pointer;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .telegram-link {
        background: linear-gradient(135deg, rgba(37, 99, 235, 0.25), rgba(59, 130, 246, 0.15));
        border-color: rgba(96, 165, 250, 0.35);
      }

      .primary-btn {
        color: white;
        background: linear-gradient(135deg, var(--primary), var(--emerald));
      }

      .danger-btn {
        color: white;
        background: linear-gradient(135deg, #ef4444, #f97316);
      }

      .ghost-btn {
        color: var(--text);
        background: rgba(148, 163, 184, 0.1);
        border: 1px solid rgba(148, 163, 184, 0.18);
      }

      .primary-btn:hover,
      .danger-btn:hover,
      .ghost-btn:hover {
        transform: translateY(-1px) scale(1.01);
      }

      .lang-toggle:hover {
        transform: translateY(-1px);
      }

      .auth-message {
        min-height: 20px;
        margin-top: 6px;
        color: #fca5a5;
        font-size: 0.88rem;
        text-align: center;
      }

      .console-shell.hidden,
      .auth-shell.hidden {
        display: none;
      }

      .console-panel {
        width: min(1200px, 100%);
      }

      .console-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 22px 24px 16px;
        border-bottom: 1px solid var(--line);
      }

      .console-header h2 {
        margin: 0;
        font-size: clamp(1.7rem, 1vw + 1rem, 2.4rem);
        letter-spacing: -0.05em;
      }

      .console-header-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .console-body {
        padding: 20px 24px 26px;
      }

      .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
        flex-wrap: wrap;
      }

      .toolbar p {
        margin: 0;
        color: var(--muted);
      }

      .toolbar-buttons {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .table-wrap {
        overflow: auto;
        border-radius: 18px;
        border: 1px solid rgba(148, 163, 184, 0.18);
        background: rgba(2, 8, 23, 0.34);
      }

      table {
        width: 100%;
        min-width: 720px;
        border-collapse: collapse;
      }

      th,
      td {
        padding: 14px 16px;
        border-bottom: 1px solid rgba(148, 163, 184, 0.12);
        text-align: left;
      }

      th {
        background: rgba(79, 70, 229, 0.12);
        color: #dbeafe;
        font-size: 0.76rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      td {
        color: var(--text);
      }

      tbody tr:hover {
        background: rgba(148, 163, 184, 0.04);
      }

      .status-chip {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        border-radius: 999px;
        background: rgba(16, 185, 129, 0.12);
        border: 1px solid rgba(16, 185, 129, 0.3);
        color: #bbf7d0;
        font-size: 0.8rem;
        font-weight: 700;
        padding: 7px 10px;
      }

      .empty-state {
        padding: 24px;
        text-align: center;
        color: var(--muted);
      }

      @media (max-width: 700px) {
        .console-header,
        .toolbar {
          flex-direction: column;
          align-items: flex-start;
        }

        .console-header-actions,
        .toolbar-buttons {
          width: 100%;
        }

        .primary-btn,
        .danger-btn,
        .ghost-btn {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="authScreen" class="auth-shell">
      <div class="auth-panel">
        <div style="display:flex;justify-content:flex-end;gap:10px;margin-bottom:10px;flex-wrap:wrap;">
          <a href="https://t.me/GramPanchayatRampura" target="_blank" rel="noopener noreferrer" class="lang-toggle telegram-link" type="button">Telegram</a>
          <button id="langToggle" class="lang-toggle" type="button">हिंदी</button>
        </div>
        <div class="lock-icon">🔒</div>
        <h1 id="adminTitle">Admin Access</h1>
        <p id="adminSubtitle">Enter the master security password to unlock the Gram Panchayat vote ledger.</p>

        <div class="password-box">
          <input id="passwordInput" type="password" placeholder="Master Security Password" autocomplete="off" />
          <button class="primary-btn" id="unlockButton" type="button">Unlock Console</button>
          <div id="authMessage" class="auth-message" aria-live="polite"></div>
        </div>
      </div>
    </div>

    <div id="adminConsole" class="console-shell hidden">
      <div class="console-panel">
        <header class="console-header">
          <h2 id="consoleTitle">Record Ledger Console</h2>
          <div class="console-header-actions">
            <button class="ghost-btn" id="refreshButton" type="button">Refresh</button>
            <button class="ghost-btn" id="logoutButton" type="button">Lock</button>
          </div>
        </header>

        <div class="console-body">
          <div class="toolbar">
            <p id="consoleHint">Latest votes appear first. Download CSV or reset database when required.</p>
            <div class="toolbar-buttons">
              <button class="primary-btn" id="downloadCsvButton" type="button">Download CSV</button>
              <button class="danger-btn" id="resetDatabaseButton" type="button">Reset Database</button>
            </div>
          </div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th id="colVoter">Voter Name</th>
                  <th id="colMobile">Mobile Number</th>
                  <th id="colCandidate">Selected Candidate</th>
                </tr>
              </thead>
              <tbody id="voteTableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
    <footer class="site-credit">Created by Krishan Kumawat</footer>

    <script>
      const GLOBAL_SETTINGS = {
        masterAdminPassword: "Krishan@2005KK",
        firebaseUrl: "https://panchayat-voting-default-rtdb.firebaseio.com/",
        candidates: [
          { id: "1", label: "Candidate 1" },
          { id: "2", label: "Candidate 2" },
          { id: "3", label: "Candidate 3" },
          { id: "4", label: "Candidate 4" },
          { id: "5", label: "Candidate 5" },
          { id: "6", label: "NOTA" }
        ]
      };

      const translations = {
        en: {
          title: "Admin Access",
          subtitle: "Enter the master security password to unlock the Gram Panchayat vote ledger.",
          password: "Master Security Password",
          unlock: "Unlock Console",
          invalid: "Invalid password. Access denied.",
          consoleTitle: "Record Ledger Console",
          refresh: "Refresh",
          lock: "Lock",
          hint: "Latest votes appear first. Download CSV or reset database when required.",
          download: "Download CSV",
          reset: "Reset Database",
          voter: "Voter Name",
          mobile: "Mobile Number",
          candidate: "Selected Candidate",
          empty: "No votes recorded yet.",
          langToggle: "हिंदी",
          resetConfirm: "Warning: This will clear all votes from the local ledger and the live cloud database. Do you want to continue?",
          resetDone: "Election database reset complete. Ready for a fresh counting cycle.",
          csvFile: "gram_panchayat_voter_logs.csv"
        },
        hi: {
          title: "एडमिन एक्सेस",
          subtitle: "ग्राम पंचायत वोट लेजर को खोलने के लिए मास्टर सिक्योरिटी पासवर्ड दर्ज करें।",
          password: "मास्टर सिक्योरिटी पासवर्ड",
          unlock: "कंसोल खोलें",
          invalid: "पासवर्ड सही नहीं है। एक्सेस अस्वीकृत।",
          consoleTitle: "रिज़र्व लेजर कंसोल",
          refresh: "ताज़ा करें",
          lock: "लॉक",
          hint: "नवीनतम वोट पहले दिखते हैं। CSV डाउनलोड करें या डेटाबेस रीसेट करें।",
          download: "CSV डाउनलोड",
          reset: "डेटाबेस रीसेट",
          voter: "मतदाता का नाम",
          mobile: "मोबाइल नंबर",
          candidate: "चुना गया उम्मीदवार",
          empty: "अभी तक कोई वोट दर्ज नहीं हुआ है।",
          langToggle: "English",
          resetConfirm: "चेतावनी: यह लोकल लेजर और लाइव क्लाउड डेटाबेस से सभी वोट साफ कर देगा। क्या आप जारी रखना चाहते हैं?",
          resetDone: "चुनावी डेटाबेस रीसेट हो गया है। नए चुनाव के लिए तैयार है।",
          csvFile: "gram_panchayat_voter_logs.csv"
        }
      };

      const STORAGE_KEYS = {
        deviceLocked: "device_locked",
        offlineVotes: "panchayat_offline_votes"
      };

      const authScreen = document.getElementById("authScreen");
      const adminConsole = document.getElementById("adminConsole");
      const passwordInput = document.getElementById("passwordInput");
      const authMessage = document.getElementById("authMessage");
      const voteTableBody = document.getElementById("voteTableBody");
      const unlockButton = document.getElementById("unlockButton");
      const refreshButton = document.getElementById("refreshButton");
      const logoutButton = document.getElementById("logoutButton");
      const downloadCsvButton = document.getElementById("downloadCsvButton");
      const resetDatabaseButton = document.getElementById("resetDatabaseButton");
      const adminTitle = document.getElementById("adminTitle");
      const adminSubtitle = document.getElementById("adminSubtitle");
      const consoleTitle = document.getElementById("consoleTitle");
      const consoleHint = document.getElementById("consoleHint");
      const colVoter = document.getElementById("colVoter");
      const colMobile = document.getElementById("colMobile");
      const colCandidate = document.getElementById("colCandidate");
      const langToggle = document.getElementById("langToggle");

      let currentLang = localStorage.getItem("panchayat_lang") || "en";

      function detectMode() {
        return window.location.protocol === "file:" ? "offline" : "online";
      }

      function applyLanguage(lang) {
        currentLang = lang;
        localStorage.setItem("panchayat_lang", lang);
        const t = translations[lang];

        adminTitle.textContent = t.title;
        adminSubtitle.textContent = t.subtitle;
        passwordInput.placeholder = t.password;
        unlockButton.textContent = t.unlock;
        consoleTitle.textContent = t.consoleTitle;
        refreshButton.textContent = t.refresh;
        logoutButton.textContent = t.lock;
        consoleHint.textContent = t.hint;
        downloadCsvButton.textContent = t.download;
        resetDatabaseButton.textContent = t.reset;
        colVoter.textContent = t.voter;
        colMobile.textContent = t.mobile;
        colCandidate.textContent = t.candidate;
        langToggle.textContent = t.langToggle;
        refreshConsole();
      }

      function getLocalVotes() {
        try {
          return JSON.parse(localStorage.getItem(STORAGE_KEYS.offlineVotes) || "{}");
        } catch (error) {
          return {};
        }
      }

      function writeLocalVotes(votes) {
        localStorage.setItem(STORAGE_KEYS.offlineVotes, JSON.stringify(votes));
      }

      function getCandidateName(candidateId) {
        const candidate = GLOBAL_SETTINGS.candidates.find((item) => item.id === String(candidateId));
        return candidate ? candidate.label : "Unknown";
      }

      async function fetchRemoteVotes() {
        try {
          const response = await fetch(`${GLOBAL_SETTINGS.firebaseUrl}votes.json`, { method: "GET" });
          if (!response.ok) {
            throw new Error("Cloud unavailable");
          }
          const data = await response.json();
          return data || {};
        } catch (error) {
          return {};
        }
      }

      function normalizeVotes(votesObject) {
        const items = [];
        if (!votesObject || typeof votesObject !== "object") return items;

        Object.entries(votesObject).forEach(([mobileKey, vote]) => {
          if (!vote || typeof vote !== "object") return;
          items.push({
            voterName: vote.voterName || "Unknown",
            mobileNumber: vote.mobileNumber || mobileKey,
            selectedCandidate: vote.selectedCandidate || vote.candidateId || "Unknown",
            timestamp: vote.timestamp || 0
          });
        });

        return items.sort((a, b) => new Date(b.timestamp || 0) - new Date(a.timestamp || 0));
      }

      async function getAllVotes() {
        if (detectMode() === "offline") {
          return normalizeVotes(getLocalVotes());
        }

        const remoteVotes = await fetchRemoteVotes();
        const localVotes = getLocalVotes();
        return normalizeVotes({ ...localVotes, ...remoteVotes });
      }

      function renderTable(votes) {
        if (!votes.length) {
          voteTableBody.innerHTML = `<tr><td colspan="3" class="empty-state">${translations[currentLang].empty}</td></tr>`;
          return;
        }

        voteTableBody.innerHTML = votes.map((vote) => `
          <tr>
            <td>${vote.voterName}</td>
            <td>${vote.mobileNumber}</td>
            <td><span class="status-chip">${getCandidateName(vote.selectedCandidate)}</span></td>
          </tr>
        `).join("");
      }

      async function refreshConsole() {
        const votes = await getAllVotes();
        renderTable(votes);
      }

      function unlockConsole() {
        const enteredPassword = passwordInput.value;

        if (enteredPassword === GLOBAL_SETTINGS.masterAdminPassword) {
          authScreen.classList.add("hidden");
          adminConsole.classList.remove("hidden");
          authMessage.textContent = "";
          refreshConsole();
        } else {
          authMessage.textContent = translations[currentLang].invalid;
        }
      }

      function lockConsole() {
        adminConsole.classList.add("hidden");
        authScreen.classList.remove("hidden");
        passwordInput.value = "";
        authMessage.textContent = "";
      }

      function downloadCsv() {
        getAllVotes().then((votes) => {
          const headers = [translations[currentLang].voter, translations[currentLang].mobile, translations[currentLang].candidate];
          const rows = votes.map((vote) => [
            vote.voterName,
            vote.mobileNumber,
            getCandidateName(vote.selectedCandidate)
          ]);

          const csvRows = [headers, ...rows].map((row) => row.map(value => `"${String(value).replace(/"/g, '""')}"`).join(",")).join("\n");
          const csvBlob = new Blob(["\uFEFF" + csvRows], { type: "text/csv;charset=utf-8;" });
          const link = document.createElement("a");
          const url = URL.createObjectURL(csvBlob);

          link.href = url;
          link.download = translations[currentLang].csvFile;
          document.body.appendChild(link);
          link.click();
          link.remove();
          URL.revokeObjectURL(url);
        });
      }

      async function resetElectionDatabase() {
        const confirmed = window.confirm(translations[currentLang].resetConfirm);
        if (!confirmed) return;

        localStorage.removeItem(STORAGE_KEYS.offlineVotes);
        localStorage.removeItem(STORAGE_KEYS.deviceLocked);

        if (detectMode() === "online") {
          try {
            await fetch(`${GLOBAL_SETTINGS.firebaseUrl}.json`, { method: "DELETE" });
          } catch (error) {
            console.warn("Cloud reset failed.", error);
          }
        }

        alert(translations[currentLang].resetDone);
        refreshConsole();
      }

      langToggle.addEventListener("click", () => {
        const nextLang = currentLang === "en" ? "hi" : "en";
        applyLanguage(nextLang);
      });

      unlockButton.addEventListener("click", unlockConsole);
      passwordInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          unlockConsole();
        }
      });
      refreshButton.addEventListener("click", refreshConsole);
      logoutButton.addEventListener("click", lockConsole);
      downloadCsvButton.addEventListener("click", downloadCsv);
      resetDatabaseButton.addEventListener("click", resetElectionDatabase);

      document.addEventListener("DOMContentLoaded", () => {
        applyLanguage(currentLang);
        refreshConsole();
      });
    </script>
  </body>
</html>
